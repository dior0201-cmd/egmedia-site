<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EGMedia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .brand {
      font-size: clamp(40px, 9vw, 88px);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .tag {
      margin-top: 16px;
      font-size: clamp(14px, 2.4vw, 18px);
      font-weight: 400;
      color: #9a9a9a;
      letter-spacing: 0.08em;
    }
    .note {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: #555;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="brand">EGMedia</div>
  <div class="tag">Official website coming soon</div>
  <div class="note">Placeholder — site under construction</div>
</body>
</html>
