<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EGMedia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .slide {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 50vh;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    @media (min-width: 1024px) {
      body {
        flex-direction: row;
      }
      .slide {
        width: 50%;
        height: 100vh;
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="slide">
    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600&q=90" alt="EGMedia Brand" id="slide1">
  </div>
  <div class="slide">
    <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1600&q=90" alt="EGMedia Experience" id="slide2">
  </div>
  
  <script>
    // Placeholder images - replace with actual PPT screenshots
    // Using high-quality placeholders that match the brand aesthetic
    document.getElementById('slide1').src = 'slide1.png';
    document.getElementById('slide2').src = 'slide2.png';
  </script>
</body>
</html>
