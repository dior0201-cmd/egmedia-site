<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EGMedia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .slide {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 50vh;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    @media (min-width: 1024px) {
      body { flex-direction: row; }
      .slide {
        width: 50%;
        height: 100vh;
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="slide">
    <img src="slide1.jpg" alt="EGMedia Visual 1" />
  </div>
  <div class="slide">
    <img src="slide2.png" alt="EGMedia Visual 2" />
  </div>
</body>
</html>
